<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Exemplo Acessibilidade</title>

    <style>
        body {
            font-family: Arial;
        }

        .btn {
            background-color: #ccc;
            color: #ddd; /* baixo contraste */
        }
    </style>
</head>
<body>

<header>
    <h1>Minha Aplicação</h1>
</header>

<nav>
    <a href="#">Home</a> |
    <a href="#">Sobre</a>
</nav>

<main>
    <h2>Cadastro</h2>

    <!-- FORMULÁRIO -->
    <form id="formCadastro">

        <!-- ERRO: label não associado -->
        <label>Nome</label>
        <input type="text" id="nome">

        <br><br>

        <!-- ERRO: sem label -->
        <input type="email" id="email" placeholder="Email">

        <br><br>

        <!-- ERRO: sem descrição acessível -->
        <button class="btn">Cadastrar</button>

    </form>

    <!-- OUTROS ELEMENTOS (não devem ser testados) -->
    <section>
        <h3>Informações</h3>
        <img src="banner.png"> <!-- erro fora do form -->
    </section>

</main>

</body>
</html>
